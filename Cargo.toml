[package]
name = "nysakura"
version = "2.0.0"
edition = "2021"
rust-version = "1.63"
authors = ["Jakub Ziaja"]
description = "Pixel-art cherry blossom tree that grows and sheds petals in your terminal"
license = "MIT"
repository = "https://github.com/77nyan/nysakura"
readme = "README.md"
keywords = ["terminal", "sakura", "cherry-blossom", "ricing", "animation"]
categories = ["command-line-utilities"]

# No dependencies on purpose: fast to build, tiny to run, nothing to audit.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
