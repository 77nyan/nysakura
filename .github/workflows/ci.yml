name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - run: ./target/release/nysakura --version
      - run: ./target/release/nysakura -p -s 7 --width 80 --height 30 | head -n 3
      - run: sh -n install.sh

  msrv:
    name: oldest supported Rust (1.63)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.63.0 --profile minimal && rustup default 1.63.0
      - run: cargo build --release
